[project]
name = "memento"
version = "0.1.0"
description = "Long-term memory/relationship engine for 42labs agents. One engine, N independent memories."
readme = "README.md"
requires-python = ">=3.11"
# Dual-licensed: AGPL-3.0 open source, commercial on request (see LICENSE). The metadata said MIT
# while the file said AGPL — a consumer reading the wheel would have taken permissions the project
# never granted, and metadata is what a consumer actually reads.
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "42labs" }]
dependencies = []

[project.scripts]
memento = "memento.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "mutmut>=3.7.0", "build>=1.2", "hatchling>=1.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memento"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The live tier is non-gating and needs a real model, so it is deselected unless asked for.
addopts = "-q -m 'not live'"
markers = ["live: non-gating live-tier tests; require a real model and are skipped by default"]

[dependency-groups]
dev = ["pytest>=8.0", "mutmut>=3.7.0", "build>=1.2", "hatchling>=1.25"]

[tool.mutmut]
# Mutation testing is how "the tests are green" becomes evidence rather than a claim: it breaks the
# engine on purpose and requires a test to notice. Three of this repo's regression tests once passed
# against the very code they were written to guard, and nothing caught it. This is what catches it.
#
# Scoped to the modules where a silent pass is a data-loss bug — the write gates, the event log, the
# store and the lock protocol, plus the queue, read path, spec, adoption and command layer that
# B-02 made load-bearing for a consumer with no Python of its own.
#
# `presentation.py` and `cli.py` are absent ON PURPOSE, and it is a boundary rather than an
# exclusion list: what those modules hold — console prose and argparse wiring — is explicitly not
# contractual (B-02 T8 R1). Everything a consumer may depend on, the exit code and the `--json`
# payload, is decided in `commands.py`, which is in scope. Anything that could change either
# belongs there too; if a mutant in a non-scope module could alter a promise, the split is wrong,
# not the ratchet.
#
# Run it as:  MEMENTO_MUTATION=1 uv run mutmut run
# The flag drops the subprocess acceptance tier from the per-mutant runner (T8 R3); without it
# every mutant pays for dozens of interpreter starts and the sweep takes hours instead of minutes.
source_paths = ["src/memento/gates.py", "src/memento/events.py", "src/memento/store.py", "src/memento/locking.py", "src/memento/queue.py", "src/memento/readpath.py", "src/memento/commands.py", "src/memento/spec.py", "src/memento/drain.py", "src/memento/adoption.py"]
# The whole package, not just the mutated modules: mutmut copies only what is listed
# here, and a partial copy means the suite dies on the first cross-module import rather than
# running against a mutant. README.md and .gitignore are here because tests read them: the wheel
# build needs the readme, the store-pattern regression reads the ignore file, and the docs test
# parses every documented invocation with the real parser.
also_copy = ["tests/", "pyproject.toml", "README.md", ".gitignore", "docs/", "src/memento/"]
