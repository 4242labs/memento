name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # The deterministic tier (ADR D6). No live model, no credentials, no token spend — which is
    # exactly why it is allowed to gate.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --python ${{ matrix.python }}

      - name: Deterministic tier
        run: uv run --python ${{ matrix.python }} pytest

      - name: Template pins match what is on disk
        run: uv run --python ${{ matrix.python }} python -m memento.templates --check

  secrets:
    # Public repo. Synthetic fixtures only, and this is what keeps that true.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        # Pinned deliberately: a scanner that changes under us changes what CI means.
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Scan history
        # .gitleaksignore carries per-finding fingerprints (commit:file:rule:line). Never widen
        # .gitleaks.toml with a path allowlist — a fingerprint dies when the line moves; a path
        # exception silently covers everything added to that file later.
        run: ./gitleaks detect --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: No credential-shaped literals outside the fixture factory
        # The pre-commit hook enforces this locally for anyone who ran `git config core.hooksPath
        # .githooks`. This is the backstop for everyone else.
        run: |
          if grep -rInE '(AKIA|ASIA)[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|sk-ant-[A-Za-z0-9_-]{20}' \
               --exclude-dir=.git --exclude=fake_credentials.py --exclude=.gitleaksignore . ; then
            echo "::error::build credential-shaped test data with tests/support/fake_credentials.py"
            exit 1
          fi
          echo "no credential-shaped literals"

  no-store-committed:
    # A store is data, never code. If one ever lands in this repo, it lands in public.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Refuse a committed store
        run: |
          # `memento/` only at the repo root: `src/memento/` is this engine's own source, and a
          # bare pattern would fail the build on every commit to it.
          if git ls-files | grep -E '^memento/|(^|/)memory/|(^|/)\.memento/' ; then
            echo "::error::a memory store appears to be tracked in this repo"
            exit 1
          fi
          echo "no store tracked"
